<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 4</title>
</head>

<body>
    <main>
        <section>
            <h1>Formulario</h1>
        </section>

        <section>
            <form action="">

                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" placeholder="Nombre" required><br>

                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" placeholder="Apellido"><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" placeholder="Email"><br>

                <label for="contraseña">Contraseña:</label><br>
                <input type="password" id="contraseña" placeholder="Contraseña"><br>

                <label for="edad">Edad:</label><br>
                <input type="number" id="edad" placeholder="Edad"><br><br>

                <label for="terminos">Aceptar terminos y condiciones:</label><br>
                <input type="checkbox" id="terminos" required><br><br>

                <button type="submit">Enviar</button>

            </form>

        </section>
    </main>
</body>

</html>
