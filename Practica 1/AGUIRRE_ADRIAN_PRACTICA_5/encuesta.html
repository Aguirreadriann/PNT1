<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 5</title>
</head>

<body>
    <main>
        <section>
            <h1>Encuesta</h1>
        </section>

        <section>
            <h2>Lenguaje principal</h2>
            <form action="">
                <label for="python">Python</label>
                <input type="radio" id="python" name="lenguaje">

                <label for="javaScript-radio">JavaScript</label>
                <input type="radio" id="javaScript-radio" name="lenguaje">

                <label for="c#">C#</label>
                <input type="radio" id="c#" name="lenguaje">

                <h2>Tecnologías conocidas</h2>

                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="tecnologias">

                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="tecnologias">

                <label for="javaScript-check">JavaScript</label>
                <input type="checkbox" id="javaScript-check" name="tecnologias">

                <label for="sql">SQL</label>
                <input type="checkbox" id="sql" name="tecnologias">

                <label for="java">Java</label>
                <input type="checkbox" id="java" name="tecnologias">

                <label for="git">Git</label>
                <input type="checkbox" id="git" name="tecnologias">

                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="tecnologias">

                <h2>Carrera</h2>

                <label for="carrera">Seleccioná tu carrera:</label>

                <select name="carrera" id="carrera">
                    <option value="">Seleccioná una opción</option>
                    <option value="">Ingenieria</option>
                    <option value="">Licenciatura</option>
                    <option value="">Tecnicatura</option>
                    <option value="">Profesorado</option>
                </select><br><br>

                <button type="submit">Enviar</button>

            </form>
        </section>

    </main>
</body>

</html>
