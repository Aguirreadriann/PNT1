<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 8</title>
</head>

<body>
    <main>
        <section>
            <h1>Inscripción universitaria</h1>
        </section>

        <section>
            <form action="">

                <h2>Datos personales</h2>

                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" placeholder="Nombre" required><br>

                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" placeholder="Apellido"><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" placeholder="Email" required><br>

                <h2>Carrera</h2>

                <label for="carrera">Carrera:</label>
                <select name="carrera" id="carrera">
                    <option value="">Seleccione carrera</option>
                    <option value="">Analista de sistemas</option>
                    <option value="">Biotecnologia</option>
                    <option value="">Diseño grafico</option>
                    <option value="">Matematicas</option>
                </select>

                <h2>Conocimientos</h2>

                <input type="checkbox" id="java" name="conocimientos">
                <label for="java">Java:</label>

                <input type="checkbox" id="javaScript" name="conocimientos">
                <label for="javaScript">JavaScript:</label>

                <input type="checkbox" id="html" name="conocimientos">
                <label for="html">HTML:</label>

                <input type="checkbox" id="excel" name="conocimientos">
                <label for="excel">Excel:</label>

                <h2>Modalidad</h2>

                <input type="radio" id="presencial" name="modalidad">
                <label for="presencial">Presencial</label>

                <input type="radio" id="virtual" name="modalidad">
                <label for="virtual">Virtual</label>

                <h2>Mensaje</h2>

                <label for="mensaje">Escriba su mensaje:</label><br>
                <textarea name="mensaje" id="mensaje" placeholder="Ingrese un mensaje..."
                    style="width: 300px; height: 150px;"></textarea>

                <br><button type="submit">Inscribirme</button>

            </form>
        </section>
    </main>
</body>

</html>
